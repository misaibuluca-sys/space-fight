<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Space Fight — Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#05040d; color:#e8ecff; font-family:'Rajdhani', sans-serif; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .hidden { display:none !important; }

  h1 { font-family:'Orbitron'; font-size:1.5rem; letter-spacing:0.06em; background:linear-gradient(90deg,#5ef1ff,#b98bff 40%,#ff6fd8 72%); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:0.4rem; }
  .sub { font-size:0.85rem; letter-spacing:0.12em; text-transform:uppercase; color:#8fa3ff; opacity:0.75; margin-bottom:1.4rem; }

  /* ---- room code entry ---- */
  #screen-room { display:flex; flex-direction:column; align-items:center; gap:1rem; width:100%; padding:1.5rem; }
  #room-input {
    width:min(240px, 60vw); text-align:center; letter-spacing:0.5em;
    font-family:'Orbitron'; font-size:1.6rem; padding:0.7rem;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.25);
    border-radius:10px; color:#ffe066;
  }
  .big-btn {
    width:min(280px, 75vw); padding:1rem; border-radius:14px; font-family:'Orbitron'; font-size:1rem; letter-spacing:0.05em;
    border:2px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.06); color:#fff; text-transform:uppercase;
  }
  #room-msg { font-size:0.85rem; color:#ff6f8b; min-height:1.2em; }

  /* ---- pick screen ---- */
  #screen-pick { display:flex; flex-direction:column; align-items:center; gap:0.7rem; width:100%; padding:1.5rem; overflow-y:auto; }
  .pick-btn {
    width:min(340px, 80vw); padding:1rem; border-radius:16px; font-family:'Orbitron'; font-size:1.1rem; letter-spacing:0.05em;
    border:2px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); color:#fff; text-transform:uppercase;
  }
  .pick-btn:disabled { opacity:0.3; }
  #pick-msg { font-size:0.85rem; color:#ff6f8b; min-height:1.2em; }

  /* ---- controller screen ---- */
  #screen-controller { display:flex; flex-direction:column; width:100%; height:100%; padding:0.6rem 1rem; }
  .ctrl-header { display:flex; justify-content:space-between; align-items:center; padding:0.2rem 0.2rem 0.4rem; }
  .ctrl-player-tag { font-family:'Orbitron'; font-size:0.95rem; letter-spacing:0.05em; }
  .ctrl-leave { font-size:0.75rem; color:#8890b8; border:1px solid rgba(255,255,255,0.15); border-radius:20px; padding:0.35rem 0.8rem; background:rgba(255,255,255,0.04); }

  .ctrl-body { flex:1; display:flex; align-items:center; justify-content:space-between; gap:0.6rem; min-height:0; }

  /* ---- joystick (replaces the old d-pad) ---- */
  .joystick-base {
    position:relative; width:min(42vh, 42vw, 210px); height:min(42vh, 42vw, 210px);
    border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 50% 45%, rgba(255,255,255,0.08), rgba(255,255,255,0.02) 70%);
    border:2px solid rgba(255,255,255,0.18);
    touch-action:none;
  }
  .joystick-stick {
    position:absolute; top:50%; left:50%; width:38%; height:38%;
    border-radius:50%; background:rgba(94,241,255,0.28); border:2px solid rgba(94,241,255,0.75);
    box-shadow:0 0 18px rgba(94,241,255,0.45);
    transform:translate(-50%,-50%);
    transition:background .1s ease;
    pointer-events:none;
  }
  .joystick-base.active .joystick-stick { background:rgba(94,241,255,0.5); }

  .powers { display:flex; flex-direction:column; gap:0.8rem; flex-shrink:0; }
  .power-btn {
    width:min(24vh, 26vw, 108px); height:min(24vh, 26vw, 108px); border-radius:50%;
    font-family:'Orbitron'; font-size:0.8rem; letter-spacing:0.03em;
    border:2px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.06); color:#fff;
  }
  .power-btn.active { transform:scale(0.94); }

  #conn-banner {
    position:fixed; top:0; left:0; right:0; text-align:center; font-size:0.75rem; padding:0.35rem;
    background:#ff3b5c; color:#fff; letter-spacing:0.05em; text-transform:uppercase; z-index:10;
  }

  /* ---- rotate hint (shown while the phone is in portrait) ---- */
  #rotate-hint {
    position:fixed; inset:0; z-index:20; background:rgba(4,3,12,0.92);
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:0.8rem;
    text-align:center; padding:2rem;
  }
  #rotate-hint .icon { font-size:2.6rem; animation:rotateHintSpin 1.6s ease-in-out infinite; }
  @keyframes rotateHintSpin { 0%,100%{ transform:rotate(0deg);} 50%{ transform:rotate(90deg);} }
  @media (orientation: portrait) {
    #screen-controller.showing #rotate-hint { display:flex; }
  }
</style>
</head>
<body>
<div id="conn-banner" class="hidden">Conectando…</div>
<div id="app">

  <div id="screen-room">
    <h1>SPACE FIGHT</h1>
    <div class="sub">Controle pelo celular</div>
    <div style="font-size:0.85rem; color:#9aa3d9;">Digite o código mostrado no telão:</div>
    <input id="room-input" inputmode="numeric" maxlength="4" placeholder="0000">
    <button class="big-btn" id="btn-room-join">Entrar</button>
    <div id="room-msg"></div>
  </div>

  <div id="screen-pick" class="hidden">
    <h1>SPACE FIGHT</h1>
    <div class="sub">Escolha seu jogador</div>
    <div id="pick-buttons"></div>
    <div id="pick-msg"></div>
  </div>

  <div id="screen-controller" class="hidden">
    <div id="rotate-hint"><div class="icon">📱</div><div>Gire o celular na horizontal para jogar melhor</div></div>
    <div class="ctrl-header">
      <div class="ctrl-player-tag" id="ctrl-player-tag">Player 1</div>
      <button class="ctrl-leave" id="btn-leave">trocar</button>
    </div>
    <div class="ctrl-body">
      <div class="joystick-base" id="joystick-base">
        <div class="joystick-stick" id="joystick-stick"></div>
      </div>
      <div class="powers">
        <button class="power-btn" id="btn-power1" data-action="power1">PODER 1</button>
        <button class="power-btn" id="btn-power2" data-action="power2">PODER 2</button>
      </div>
    </div>
  </div>

</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const PALETTE = ['#5ef1ff', '#ff6fd8', '#ffe066', '#b98bff', '#5cff9d'];
  let peer = null;
  let dataConn = null;
  let myPlayer = null;
  let maxPlayers = 2;
  let takenSlots = [];

  function showBanner(text){ const b = $('conn-banner'); b.textContent = text; b.classList.remove('hidden'); }
  function hideBanner(){ $('conn-banner').classList.add('hidden'); }

  $('room-input').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
  });

  function buildPickButtons(){
    const wrap = $('pick-buttons');
    wrap.innerHTML = '';
    for (let i = 1; i <= 5; i++){
      const btn = document.createElement('button');
      btn.className = 'pick-btn';
      btn.style.borderColor = PALETTE[i-1];
      btn.style.color = PALETTE[i-1];
      btn.textContent = 'Player ' + i;
      const unavailable = i > maxPlayers || takenSlots.includes(i);
      btn.disabled = unavailable;
      btn.onclick = () => pick(i);
      wrap.appendChild(btn);
    }
  }

  function connectToRoom(code){
    $('room-msg').textContent = '';
    showBanner('Conectando…');
    if (peer) { try { peer.destroy(); } catch(e){} }
    peer = new Peer();
    peer.on('open', () => {
      dataConn = peer.connect('sf-host-' + code, { reliable: true });
      dataConn.on('open', () => {
        hideBanner();
      });
      dataConn.on('data', (msg) => {
        if (msg.type === 'room-info'){
          maxPlayers = msg.maxPlayers || 2;
          takenSlots = msg.taken || [];
          if (!$('screen-room').classList.contains('hidden')){
            $('screen-room').classList.add('hidden');
            $('screen-pick').classList.remove('hidden');
          }
          if (myPlayer === null){
            buildPickButtons();
          }
        } else if (msg.type === 'join-ok'){
          $('screen-pick').classList.add('hidden');
          const ctrl = $('screen-controller');
          ctrl.classList.remove('hidden');
          ctrl.classList.add('showing');
          const tag = $('ctrl-player-tag');
          tag.textContent = 'Player ' + myPlayer;
          const color = PALETTE[myPlayer-1];
          tag.style.color = color;
          [$('btn-power1'), $('btn-power2'), $('joystick-stick')].forEach(el => {
            el.style.borderColor = color;
            el.style.color = color;
          });
        } else if (msg.type === 'join-fail'){
          $('pick-msg').textContent = 'Esse jogador já está ocupado. Escolha outro.';
          myPlayer = null;
        }
      });
      dataConn.on('close', () => {
        showBanner('Conexão perdida — tentando reconectar…');
        setTimeout(() => connectToRoom(code), 1500);
      });
      dataConn.on('error', () => {
        $('room-msg').textContent = 'Não foi possível conectar. Confira o código e tente de novo.';
        hideBanner();
      });
    });
    peer.on('error', (err) => {
      $('room-msg').textContent = 'Não foi possível conectar. Confira o código e tente de novo.';
      hideBanner();
    });
  }

  $('btn-room-join').onclick = () => {
    const code = $('room-input').value.trim();
    if (code.length !== 4) { $('room-msg').textContent = 'Digite o código de 4 dígitos.'; return; }
    connectToRoom(code);
  };

  function pick(player){
    if (!dataConn || !dataConn.open) return;
    myPlayer = player;
    $('pick-msg').textContent = '';
    dataConn.send({ type:'join', player });
  }

  $('btn-leave').onclick = () => {
    myPlayer = null;
    $('screen-controller').classList.add('hidden');
    $('screen-controller').classList.remove('showing');
    $('screen-pick').classList.remove('hidden');
    buildPickButtons();
  };

  function sendInput(action, pressed){
    if (!myPlayer || !dataConn || !dataConn.open) return;
    dataConn.send({ type:'input', action, pressed });
  }
  function sendMove(x, y){
    if (!myPlayer || !dataConn || !dataConn.open) return;
    dataConn.send({ type:'move', x, y });
  }

  function bindHold(el, action){
    const press = (e) => { e.preventDefault(); el.classList.add('active'); sendInput(action, true); };
    const release = (e) => { e.preventDefault(); el.classList.remove('active'); sendInput(action, false); };
    el.addEventListener('pointerdown', press);
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('pointerleave', release);
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  bindHold($('btn-power1'), 'power1');
  bindHold($('btn-power2'), 'power2');

  // ---- virtual joystick ----
  const jBase = $('joystick-base');
  const jStick = $('joystick-stick');
  let jDragging = false;
  let jRect = null;

  function updateStick(dx, dy){
    jStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }
  function fromEvent(e){
    const cx = jRect.left + jRect.width/2;
    const cy = jRect.top + jRect.height/2;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const maxR = jRect.width/2 - (jRect.width*0.19);
    const dist = Math.hypot(dx, dy) || 0.0001;
    if (dist > maxR){ dx = dx/dist*maxR; dy = dy/dist*maxR; }
    updateStick(dx, dy);
    sendMove(dx/maxR, dy/maxR);
  }
  jBase.addEventListener('pointerdown', (e) => {
    jDragging = true;
    jRect = jBase.getBoundingClientRect();
    jBase.classList.add('active');
    try { jBase.setPointerCapture(e.pointerId); } catch(err){}
    fromEvent(e);
  });
  jBase.addEventListener('pointermove', (e) => { if (jDragging) fromEvent(e); });
  function jRelease(){
    if (!jDragging) return;
    jDragging = false;
    jBase.classList.remove('active');
    updateStick(0, 0);
    sendMove(0, 0);
  }
  jBase.addEventListener('pointerup', jRelease);
  jBase.addEventListener('pointercancel', jRelease);

  document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
  document.addEventListener('gesturestart', e => e.preventDefault());

})();
</script>
</body>
</html>
